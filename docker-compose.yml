# NOTE: written against the Docker Compose spec but not exercised on this
# machine (no local Docker install — see PLAN.md "Environment constraints").
# Everything it wires together (Postgres DSN, CORS origin, ports) matches
# what was verified working locally with SQLite + `npm run dev` /
# `uvicorn --reload`, so the only untested part is Compose/Docker itself.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aire
      POSTGRES_PASSWORD: aire
      POSTGRES_DB: aire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aire"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      AIRE_DATABASE_URL: postgresql+psycopg2://aire:aire@postgres:5432/aire
      AIRE_LLM_PROVIDER: auto
      AIRE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AIRE_OLLAMA_HOST: http://host.docker.internal:11434
      AIRE_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
